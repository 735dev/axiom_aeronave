# SPA servida detras del reverse proxy (TLS y HSTS los pone el proxy, ver backend docker/prod/Caddyfile).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # CSP: el SPA solo habla con su API. Ajustar connect-src al host real de la API.
    # style-src 'unsafe-inline' es necesario para estilos inline de Radix/sonner.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https:; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    # Assets con hash: cache larga. Service worker e index: nunca cachear (despliegues visibles al instante).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /sw.js { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https:; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
