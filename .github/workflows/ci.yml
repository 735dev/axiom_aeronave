name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npx vitest run
      - name: Build (bundle de produccion, sin mocks)
        run: npm run build
        env:
          VITE_PUBLIC_USE_MOCKS: "false"
          VITE_PUBLIC_URL_API: https://api.example.com
      - name: "Auditoria de dependencias (solo prod)"
        run: npm audit --omit=dev --audit-level=high
      - name: Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E con API mock (construye y sirve el build real)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          retention-days: 7

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile }
      - name: Build
        run: docker build -t aeronaves-web:ci --build-arg VITE_PUBLIC_URL_API=https://api.example.com .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: aeronaves-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
